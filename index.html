<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071e2b">
  <meta name="description" content="从西山到城市，从雪场到乐园。进入一张可以旋转、点亮和切换冬景的北京十二地点立体地图。">
  <title>北京十二坐标 · 立体场地卡</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=panorama24">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script type="module" src="./main.mjs?v=panorama24"></script>
</head>
<body>
  <main class="field-shell">
    <article class="spell-card" aria-labelledby="field-title">
      <header class="card-heading">
        <div class="title-block"><p class="card-kind">场地魔法 · 北京全图</p><h1 id="field-title">一座北京，十二个坐标</h1><p class="places">山野 <span aria-hidden="true">·</span> 城市 <span aria-hidden="true">·</span> 乐园</p></div>
        <div class="field-seal" aria-hidden="true"><span>京</span></div>
      </header>

      <div class="visit-toolbar" aria-label="地图导览">
        <button type="button" id="visit-back" title="返回刚才的地图位置" hidden>← 返回地图</button>
        <span id="visit-status">拖动平移 · 点选地标</span>
        <button type="button" id="view-mode" aria-pressed="false" aria-controls="free-view-controls">自由看</button>
      </div>
      <section class="stage" id="stage" aria-label="北京十二地点立体场景">
        <img class="preview" id="preview" src="./preview.png?v=panorama24" alt="北京全图静态预览：西山、城市街区和乐园，在蓝金夜色中连成十二个地点。">
        <div class="canvas-host" id="canvas-host"></div>
        <div class="stage-vignette" aria-hidden="true"></div>
        <div class="scene-caption" id="scene-caption"><span class="caption-rule" aria-hidden="true"></span><p id="caption-title">北京，灯火铺展开来</p><span id="caption-detail">点击地标，或从下方选择一个地点。</span></div>
        <div class="location-tether" id="location-tether" aria-hidden="true" hidden></div>
        <aside class="location-card" id="location-card" aria-label="所选地点信息" hidden>
          <div class="location-card-surface" id="location-card-surface">
            <p class="location-card-label" id="location-card-label"></p>
            <h2 id="location-card-title"></h2>
            <p class="location-card-type" id="location-card-type"></p>
            <p class="location-card-line" id="location-card-line"></p>
          </div>
        </aside>
        <div class="load-panel" id="load-panel" role="status">
          <span class="load-mark" aria-hidden="true">京</span><p id="load-title">北京，正在入夜</p><span id="load-detail">正在展开十二个坐标…</span>
          <progress id="load-progress" max="100" aria-label="地图加载进度"></progress>
          <button id="retry" class="retry-button" hidden>重新载入</button>
        </div>
        <div class="place-hover" id="place-hover" hidden aria-hidden="true"></div>
      </section>

      <footer class="card-footer">
        <button type="button" id="start-beihai" class="visit-entry"><strong>从北海开始</strong><span>白塔 · 湖岛 · 东岸</span><span aria-hidden="true">↗</span></button>
        <nav id="beihai-views" class="beihai-views" aria-label="北海取景" hidden>
          <button type="button" data-shot="island" aria-pressed="true">湖岛全貌</button>
          <button type="button" data-shot="pagoda" aria-pressed="false">白塔</button>
          <button type="button" data-shot="shore" aria-pressed="false">东岸</button>
        </nav>
        <div id="free-view-controls" class="free-view-controls" hidden>
        <div class="navigation-tools" aria-label="浏览地图">
          <div class="drag-modes" role="group" aria-label="拖动方式">
            <button type="button" data-drag-mode="rotate" aria-pressed="true">旋转</button>
            <button type="button" data-drag-mode="pan" aria-pressed="false">平移</button>
          </div>
          <div class="view-shortcuts">
            <button type="button" id="recenter" title="重新对准当前地点">重置视角</button>
            <button type="button" id="overview" title="回到北京全景，保留季节和灯光">回全景</button>
          </div>
        </div>
        <div class="camera-controls" aria-label="调整视角">
          <button type="button" data-camera="left" aria-label="向左旋转视角" title="向左旋转">↶</button>
          <button type="button" data-camera="right" aria-label="向右旋转视角" title="向右旋转">↷</button>
          <span aria-hidden="true"></span>
          <button type="button" data-camera="in" aria-label="放大场景" title="放大">＋</button>
          <button type="button" data-camera="out" aria-label="缩小场景" title="缩小">−</button>
        </div>
        <p class="gesture-hint" id="gesture-hint"><span class="desktop-gesture">拖动旋转 · 右键平移 · 滚轮靠近指针</span><span class="touch-gesture"><span id="touch-drag-hint">单指旋转</span><span>双指缩放 / 平移</span></span></p>
        </div>
        <nav class="place-navigation" aria-label="北京十二地点">
          <button type="button" class="overview-button" data-focus="all" aria-pressed="true">全景</button>
          <div class="place-list" id="place-list" role="group" aria-label="选择地点"></div>
          <div class="mobile-place-picker"><label for="place-select">去一个地方</label><select id="place-select" aria-label="选择北京地点"><option value="all">北京全景</option></select></div>
        </nav>
        <nav class="resort-navigation" id="resort-navigation" aria-label="崇礼雪场近景" hidden></nav>
        <aside class="location-dock" id="location-dock" aria-label="所选地点信息" hidden><p><span id="dock-label"></span><strong id="dock-title"></strong><span id="dock-type"></span></p><p id="dock-line"></p></aside>
        <details class="map-settings"><summary>季节与设置</summary>
        <div class="field-actions">
          <p class="field-note" id="field-note">遵循北京地理方位 · 距离与尺度经过压缩</p>
          <div class="spell-controls" role="group" aria-label="场地效果">
            <button type="button" id="lights" aria-pressed="false"><span class="effect-glyph" aria-hidden="true">✧</span><span>点亮工体</span></button>
            <button type="button" id="winter" aria-pressed="false"><span class="effect-glyph snow-glyph" aria-hidden="true">❄</span><span>冬日降临</span></button>
          </div>
          <div class="utility-controls"><button type="button" id="pause" aria-pressed="false">暂停动效</button><button type="button" id="reduce-motion" aria-pressed="false">减少动态</button><button type="button" id="restore">还原场景</button></div>
        </div>
        </details>
      </footer>
    </article>
    <p class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true">正在加载北京全图。</p>
    <noscript><p class="no-script">请开启 JavaScript 体验立体场景。上方为全图预览。</p></noscript>
  </main>
</body>
</html>
